# A1 单服务启动证据：notification-service 对架构图 C07 任务通知服务，健康检查端口 8087。
server:
  port: 8087
spring:
  application:
    # B2 注册名：Gateway 和内部事件消费者按该服务名访问通知服务。
    name: smartgrade-notification-service
  config:
    # B3 外置配置：通知和 Sentinel 公共配置来自 Nacos。
    import: "optional:nacos:smartgrade-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartgrade_notification;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        # B2 注册中心地址；健康实例会出现在 Nacos 服务列表。
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true
  jackson:
    default-property-inclusion: non_null
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
app:
  sms:
    provider: ${SMS_PROVIDER:mock}
    webhook-url: ${SMS_WEBHOOK_URL:}
    smtp-host: ${SMTP_HOST:smtp.qq.com}
    smtp-port: ${SMTP_PORT:465}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-from: ${SMTP_FROM:}
