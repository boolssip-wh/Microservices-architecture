# A1 单服务启动证据：report-service 对架构图 C06 统计报告服务，健康检查端口 8086。
server:
  port: 8086
spring:
  application:
    # B2 注册名：Gateway 路由 /api/reports/** 时按服务名发现本服务。
    name: smartgrade-report-service
  config:
    # B3 外置配置：从 Nacos 读取统一公共配置。
    import: "optional:nacos:smartgrade-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartgrade_report;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        # B2 注册中心地址；服务列表中的健康状态由 Nacos 心跳维护。
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 4000
            read-timeout: 15000
  jackson:
    default-property-inclusion: non_null
app:
  storage:
    root: ${EXPORT_STORAGE_ROOT:./.data/exports}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
