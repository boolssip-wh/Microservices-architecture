<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智批作业通 · 单体版 Demo</title>
    <style>
        :root {
            --brand: #2f6bff;
            --brand-dark: #1b4ed8;
            --bg: #f4f6fb;
            --card: #ffffff;
            --line: #e3e8f2;
            --text: #1c2333;
            --muted: #6b7690;
            --ok: #16a34a;
            --bad: #dc2626;
            --warn: #d97706;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
        header { background: linear-gradient(120deg, #2f6bff, #5b8bff); color: #fff; padding: 18px 28px; }
        header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
        .wrap { max-width: 1180px; margin: 20px auto; padding: 0 16px 60px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(28,35,51,.04); }
        .card h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .grid2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
        @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
        button { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px;
            padding: 8px 14px; font-size: 13px; cursor: pointer; }
        button:hover { background: var(--brand-dark); }
        button.ghost { background: #fff; color: var(--brand); }
        button.grey { background: #eef1f8; border-color: var(--line); color: var(--text); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        input, textarea, select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
            font-size: 13px; font-family: inherit; background: #fff; color: var(--text); }
        textarea { width: 100%; min-height: 64px; resize: vertical; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
            background: #eef3ff; color: var(--brand-dark); }
        .tag.ok { background: #e8f7ee; color: var(--ok); }
        .tag.bad { background: #fdeaea; color: var(--bad); }
        .tag.warn { background: #fdf3e3; color: var(--warn); }
        .muted { color: var(--muted); font-size: 12.5px; }
        .q { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
        .q .stem { font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
        .q .opts label { display: block; margin: 4px 0; font-size: 13.5px; cursor: pointer; }
        .detail { margin-top: 8px; padding: 10px 12px; background: #f8faff; border-radius: 8px; font-size: 13px;
            line-height: 1.7; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 500; font-size: 12px; }
        .bar { height: 10px; border-radius: 6px; background: #eef1f8; overflow: hidden; }
        .bar > i { display: block; height: 100%; background: var(--brand); }
        .toast { position: fixed; right: 20px; bottom: 20px; background: #1c2333; color: #fff;
            padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; }
        .toast.show { opacity: .94; }
        .notice { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
        .notice:last-child { border-bottom: none; }
    </style>
</head>
<body>
<header>
    <h1>智批作业通 · 单体版 Demo</h1>
    <p>第 1 周最小闭环：教师发布作业 → 学生提交 → 自动判分 → 错题本 → 教师复核 → 班级看板</p>
</header>

<div class="wrap">
    <div class="card">
        <h2>1. 登录 <small id="currentUser" class="muted">未登录</small></h2>
        <div class="row">
            <button onclick="quickLogin('teacher1')">以教师「李超」登录</button>
            <button class="ghost" onclick="quickLogin('student1')">以学生「沈熙悦」登录</button>
            <button class="grey" onclick="quickLogin('student2')">以学生「王乐」登录</button>
            <button class="grey" onclick="quickLogin('admin')">以管理员「吴椿」登录</button>
            <span class="muted">演示账号密码统一为 123456</span>
        </div>
    </div>

    <div class="grid2">
        <div>
            <div class="card">
                <h2>2. 作业列表 <small>学生看本班作业，教师看自己发布的作业</small></h2>
                <div id="assignments" class="muted">登录后自动加载…</div>
            </div>
            <div class="card" id="submitCard" style="display:none">
                <h2>3. 作答与判分 <small id="submitHint"></small></h2>
                <div id="submitBody"></div>
            </div>
            <div class="card" id="createCard" style="display:none">
                <h2>4. 教师：新建作业 <small>从题库勾选题目即可发布</small></h2>
                <div class="row" style="margin-bottom:8px">
                    <input id="newTitle" placeholder="作业标题，例如：第 4 周数学作业" style="min-width:280px" />
                    <input id="newScore" type="number" value="10" style="width:90px" title="每题分值（演示用统一分值）" />
                    <button onclick="createAssignment()">发布作业</button>
                </div>
                <div id="bank" class="muted">加载题库…</div>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>5. 错题本与推荐 <small>按知识点归集</small></h2>
                <div id="wrongbook" class="muted">登录学生账号后可见</div>
            </div>
            <div class="card">
                <h2>6. 班级看板 <small>提交率 / 分数分布 / 错题排行</small></h2>
                <div id="report" class="muted">教师登录后可见</div>
            </div>
            <div class="card">
                <h2>7. 通知 <small>批改完成 / 复核改分</small></h2>
                <div id="notices" class="muted">登录后可见</div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { token: null, user: null, assignments: [], current: null };

function toast(message, isError) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.style.background = isError ? '#b91c1c' : '#1c2333';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(path, options = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    const response = await fetch(path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
    });
    const payload = await response.json().catch(() => ({ code: -1, message: '响应解析失败' }));
    if (!response.ok || payload.code !== 0) {
        throw new Error(payload.message || ('请求失败：' + response.status));
    }
    return payload.data;
}

async function quickLogin(username) {
    try {
        const data = await api('/api/auth/login', {
            method: 'POST', body: { username, password: '123456' }
        });
        state.token = data.token;
        state.user = data.user;
        document.getElementById('currentUser').textContent =
            `当前登录：${data.user.realName}（${roleName(data.user.role)}${data.user.className ? ' · ' + data.user.className : ''}）`;
        document.getElementById('createCard').style.display = data.user.role === 'STUDENT' ? 'none' : 'block';
        await refreshAll();
        toast('登录成功：' + data.user.realName);
    } catch (error) {
        toast(error.message, true);
    }
}

function roleName(role) {
    return { STUDENT: '学生', TEACHER: '教师', ADMIN: '教务管理员' }[role] || role;
}

async function refreshAll() {
    await loadAssignments();
    if (state.user.role === 'STUDENT') {
        await loadWrongBook();
    } else {
        document.getElementById('wrongbook').innerHTML = '<span class="muted">错题本仅学生账号可见</span>';
    }
    if (state.user.role !== 'STUDENT') {
        await loadBank();
    }
    await loadNotices();
}

async function loadAssignments() {
    const list = await api('/api/assignments');
    state.assignments = list;
    const box = document.getElementById('assignments');
    if (!list.length) {
        box.innerHTML = '<span class="muted">暂无作业</span>';
        return;
    }
    box.innerHTML = list.map(item => `
        <div class="q">
            <div class="stem">${escapeHtml(item.title)}</div>
            <div class="muted">
                班级：${escapeHtml(item.className || '-')} · 题数：${item.questionCount} · 满分：${item.fullScore}
                · 截止：${formatTime(item.deadline)}
                ${item.mySubmissionStatus ? ` · <span class="tag ${item.myScore >= item.fullScore * 0.6 ? 'ok' : 'warn'}">已提交 ${item.myScore}/${item.fullScore} 分</span>` : ''}
            </div>
            <div class="row" style="margin-top:8px">
                <button class="ghost" onclick="openAssignment(${item.id})">查看题目</button>
                ${state.user.role !== 'STUDENT' ? `<button class="grey" onclick="loadReport(${item.id})">查看班级看板</button>` : ''}
            </div>
        </div>`).join('');
}

async function openAssignment(assignmentId) {
    try {
        const detail = await api('/api/assignments/' + assignmentId);
        state.current = detail;
        const card = document.getElementById('submitCard');
        card.style.display = 'block';
        const isStudent = state.user.role === 'STUDENT';
        const submitted = !!detail.mySubmissionStatus;

        document.getElementById('submitHint').textContent = isStudent
            ? (submitted ? '你已提交，下面是判分结果' : '每题作答后点击提交，系统立即判分')
            : '教师视角：学生提交后可复核改分';

        let html = `<div class="muted" style="margin-bottom:10px">${escapeHtml(detail.title)}
            · 满分 ${detail.fullScore} · 截止 ${formatTime(detail.deadline)}</div>`;

        detail.questions.forEach((question, index) => {
            html += `<div class="q">
                <div class="stem">${index + 1}. ${escapeHtml(question.stem)}
                    <span class="tag">${typeName(question.type)}</span>
                    <span class="muted">（${question.score} 分 · ${escapeHtml(question.knowledgeTag || '未标注知识点')}）</span>
                </div>`;
            if (isStudent && !submitted) {
                html += renderInput(question);
            } else {
                html += '<div class="muted">请在下方「判分结果」查看本题得分与解析</div>';
            }
            html += '</div>';
        });

        if (isStudent && !submitted) {
            html += '<button onclick="submitAnswers(' + assignmentId + ')">提交并自动判分</button>';
        }
        document.getElementById('submitBody').innerHTML = html;

        if (isStudent && submitted) {
            const mine = await api('/api/submissions/' + await mySubmissionId(assignmentId));
            renderResult(mine);
        } else if (!isStudent) {
            renderTeacherSubmissionPanel(assignmentId);
        }
    } catch (error) {
        toast(error.message, true);
    }
}

async function mySubmissionId(assignmentId) {
    const list = await api('/api/submissions?assignmentId=' + assignmentId);
    return list[0].submissionId;
}

function renderInput(question) {
    const id = 'q' + question.questionId;
    if (question.type === 'SINGLE_CHOICE' || question.type === 'JUDGE') {
        const options = question.type === 'JUDGE'
            ? ['正确', '错误']
            : (question.options || []);
        return `<div class="opts">` + options.map(option => {
            const value = question.type === 'JUDGE' ? option : option.trim().charAt(0);
            return `<label><input type="radio" name="${id}" value="${value}" /> ${escapeHtml(option)}</label>`;
        }).join('') + '</div>';
    }
    if (question.type === 'MULTIPLE_CHOICE') {
        return `<div class="opts">` + (question.options || []).map(option =>
            `<label><input type="checkbox" name="${id}" value="${option.trim().charAt(0)}" /> ${escapeHtml(option)}</label>`
        ).join('') + '</div>';
    }
    if (question.type === 'FILL_BLANK') {
        return `<input id="${id}" placeholder="填写答案" style="min-width:220px" />`;
    }
    return `<textarea id="${id}" placeholder="请分点作答，系统会按关键词辅助评分"></textarea>`;
}

function collectAnswers() {
    return state.current.questions.map(question => {
        const id = 'q' + question.questionId;
        let answer = '';
        if (question.type === 'MULTIPLE_CHOICE') {
            answer = Array.from(document.querySelectorAll(`input[name="${id}"]:checked`))
                .map(input => input.value).sort().join('');
        } else if (question.type === 'SUBJECTIVE' || question.type === 'FILL_BLANK') {
            answer = (document.getElementById(id) || {}).value || '';
        } else {
            const checked = document.querySelector(`input[name="${id}"]:checked`);
            answer = checked ? checked.value : '';
        }
        return { questionId: question.questionId, answer };
    });
}

async function submitAnswers(assignmentId) {
    try {
        const answers = collectAnswers();
        if (answers.some(item => !item.answer)) {
            toast('还有题目没有作答', true);
            return;
        }
        const key = 'demo-' + assignmentId + '-' + state.user.id + '-' + Date.now();
        const detail = await api(`/api/assignments/${assignmentId}/submissions`, {
            method: 'POST',
            headers: { 'Idempotency-Key': key },
            body: { answers }
        });
        toast(`判分完成：${detail.totalScore}/${detail.fullScore} 分`);
        renderResult(detail);
        await loadAssignments();
        await loadWrongBook();
        await loadNotices();
    } catch (error) {
        toast(error.message, true);
    }
}

function renderResult(detail) {
    let html = `<div class="detail"><b>判分结果：${detail.totalScore}/${detail.fullScore} 分</b>
        · 状态：${statusName(detail.status)} · 提交时间：${formatTime(detail.submittedAt)}</div>`;
    detail.answers.forEach(answer => {
        html += `<div class="q">
            <div class="stem">${answer.orderNo}. ${escapeHtml(answer.stem)}
                <span class="tag ${answer.correct ? 'ok' : 'bad'}">${answer.correct ? '正确' : '需订正'}</span>
                <span class="muted">得分 ${answer.score}/${answer.fullScore}</span>
            </div>
            <div class="detail">
                你的作答：${escapeHtml(answer.studentAnswer || '（空）')}<br />
                标准答案：${escapeHtml(answer.standardAnswer || '-')}<br />
                评分说明：${escapeHtml(answer.comment || '-')}
                ${answer.matchedKeywords ? `<br />命中关键词：${escapeHtml(answer.matchedKeywords)}` : ''}
                <br />评分来源：${answer.scoreSource === 'TEACHER' ? '教师复核' : '机器自动判分'}
                ${answer.type === 'SUBJECTIVE' ? `（置信度 ${(answer.confidence * 100).toFixed(0)}%）` : ''}
                ${answer.analysis ? `<br />解析：${escapeHtml(answer.analysis)}` : ''}
            </div>
        </div>`;
    });
    document.getElementById('submitBody').innerHTML =
        document.getElementById('submitBody').innerHTML + '<hr />' + html;
}

async function renderTeacherSubmissionPanel(assignmentId) {
    try {
        const list = await api(`/api/assignments/${assignmentId}/submissions`);
        if (!list.length) {
            document.getElementById('submitBody').innerHTML +=
                '<div class="muted" style="margin-top:10px">该作业还没有学生提交</div>';
            return;
        }
        let html = `<div style="margin-top:14px"><b>学生提交与复核</b>
            <div class="muted" style="margin-bottom:8px">教师可对主观题/漏选题改分，改分后写入审计日志并通知学生</div>`;
        list.forEach(submission => {
            html += `<div class="q"><div class="stem">${escapeHtml(submission.studentName)}
                　<span class="tag">${submission.totalScore}/${submission.fullScore} 分</span>
                <span class="tag ${submission.status === 'REVIEWED' ? 'ok' : ''}">${statusName(submission.status)}</span></div>`;
            submission.answers.forEach(answer => {
                html += `<div class="detail">${answer.orderNo}. ${escapeHtml(shorten(answer.stem))}
                    —— 学生作答：${escapeHtml(answer.studentAnswer || '（空）')}
                    得分 ${answer.score}/${answer.fullScore}
                    ${answer.comment ? '<br />判分说明：' + escapeHtml(answer.comment) : ''}
                    <div class="row" style="margin-top:6px">
                        <input id="score-${submission.submissionId}-${answer.questionId}" type="number"
                            value="${answer.score}" min="0" max="${answer.fullScore}" style="width:80px" />
                        <button class="grey" onclick="review(${submission.submissionId}, ${answer.questionId})">复核改分</button>
                    </div>
                </div>`;
            });
            html += '</div>';
        });
        document.getElementById('submitBody').innerHTML += html + '</div>';
    } catch (error) {
        toast(error.message, true);
    }
}

async function review(submissionId, questionId) {
    try {
        const input = document.getElementById(`score-${submissionId}-${questionId}`);
        await api(`/api/submissions/${submissionId}/review`, {
            method: 'POST',
            body: { questionId, score: Number(input.value), reason: '教师在演示控制台复核改分' }
        });
        toast('复核完成，已通知学生');
        await openAssignment(state.current.id);
        await loadReport(state.current.id);
    } catch (error) {
        toast(error.message, true);
    }
}

async function loadWrongBook() {
    try {
        const list = await api('/api/wrongbook');
        const box = document.getElementById('wrongbook');
        if (!list.length) {
            box.innerHTML = '<span class="muted">暂无错题，保持住！</span>';
            return;
        }
        box.innerHTML = list.map(item => `
            <div class="q">
                <div class="stem">${escapeHtml(shorten(item.stem))}</div>
                <div class="muted">知识点：${escapeHtml(item.knowledgeTag || '-')}
                    · 错误次数：${item.wrongTimes} · 最近作答：${escapeHtml(item.lastAnswer || '-')}</div>
                <div class="detail">标准答案：${escapeHtml(item.standardAnswer)}<br />
                    解析：${escapeHtml(item.analysis || '-')}</div>
            </div>`).join('');
        const recommendations = await api('/api/wrongbook/recommendations');
        if (recommendations.length) {
            box.innerHTML += `<div class="muted" style="margin-top:8px">
                相似题推荐（按知识点）：题目编号 ${recommendations.join('、')}</div>`;
        }
    } catch (error) {
        toast(error.message, true);
    }
}

async function loadBank() {
    try {
        const questions = await api('/api/questions');
        document.getElementById('bank').innerHTML = questions.map(question => `
            <div class="q">
                <label><input type="checkbox" class="bank-item" value="${question.id}" style="margin-right:6px" />
                    ${escapeHtml(shorten(question.stem))}</label>
                <div class="muted">${typeName(question.type)} · ${escapeHtml(question.knowledgeTag || '未标注知识点')}
                    · 参考答案：${escapeHtml(question.answerKey || '-')}</div>
            </div>`).join('');
    } catch (error) {
        toast(error.message, true);
    }
}

async function createAssignment() {
    try {
        const title = document.getElementById('newTitle').value.trim();
        if (!title) {
            toast('请填写作业标题', true);
            return;
        }
        const score = Number(document.getElementById('newScore').value) || 10;
        const selected = Array.from(document.querySelectorAll('.bank-item:checked'))
            .map(input => ({ questionId: Number(input.value), score }));
        if (!selected.length) {
            toast('请至少勾选一道题目', true);
            return;
        }
        const assignmentId = await api('/api/assignments', {
            method: 'POST',
            body: { title, subject: '数学', classId: state.user.classId, questions: selected }
        });
        toast('作业已发布，编号 ' + assignmentId);
        document.getElementById('newTitle').value = '';
        document.querySelectorAll('.bank-item').forEach(input => input.checked = false);
        await loadAssignments();
    } catch (error) {
        toast(error.message, true);
    }
}

async function loadReport(assignmentId) {
    try {
        const data = await api('/api/reports/assignments/' + assignmentId);
        const maxCount = Math.max(1, ...data.distribution.map(bucket => bucket.count));
        let html = `<div class="muted">${escapeHtml(data.title)} · ${escapeHtml(data.className || '-')}</div>
            <table>
                <tr><th>应交</th><th>已交</th><th>提交率</th><th>平均分</th><th>最高</th><th>最低</th></tr>
                <tr><td>${data.studentCount}</td><td>${data.submittedCount}</td>
                    <td>${(data.submitRate * 100).toFixed(0)}%</td>
                    <td>${data.averageScore}</td><td>${data.highestScore}</td><td>${data.lowestScore}</td></tr>
            </table>
            <h2 style="margin-top:14px"><small>分数分布</small></h2>`;
        html += data.distribution.map(bucket => `
            <div style="margin:6px 0">
                <div class="muted">${bucket.label}　${bucket.count} 人</div>
                <div class="bar"><i style="width:${(bucket.count / maxCount * 100).toFixed(0)}%"></i></div>
            </div>`).join('');
        html += '<h2 style="margin-top:14px"><small>错题排行 / 知识点薄弱</small></h2><table>';
        html += data.wrongRank.map(rank => `<tr>
                <td>${escapeHtml(shorten(rank.stem))}</td>
                <td class="tag">${escapeHtml(rank.knowledgeTag || '-')}</td>
                <td>错 ${rank.wrongCount} 人次（${(rank.wrongRate * 100).toFixed(0)}%）</td></tr>`).join('');
        html += '</table><table>';
        html += data.weakness.map(item => `<tr><td>${escapeHtml(item.knowledgeTag)}</td>
                <td>错误率 ${(item.wrongRate * 100).toFixed(0)}%</td></tr>`).join('');
        html += '</table>';
        document.getElementById('report').innerHTML = html;
    } catch (error) {
        toast(error.message, true);
    }
}

async function loadNotices() {
    try {
        const list = await api('/api/notices');
        const box = document.getElementById('notices');
        box.innerHTML = list.length ? list.slice(0, 6).map(notice => `
            <div class="notice">
                <b>${escapeHtml(notice.title)}</b>
                <span class="tag">${formatTime(notice.createdAt)}</span><br />
                ${escapeHtml(notice.content)}
            </div>`).join('') : '<span class="muted">暂无通知</span>';
    } catch (error) {
        toast(error.message, true);
    }
}

function typeName(type) {
    return { SINGLE_CHOICE: '单选题', MULTIPLE_CHOICE: '多选题', JUDGE: '判断题',
        FILL_BLANK: '填空题', SUBJECTIVE: '主观题' }[type] || type;
}

function statusName(status) {
    return { GRADING: '批改中', GRADED: '已自动判分', REVIEWED: '教师已复核' }[status] || status;
}

function formatTime(value) {
    if (!value) return '-';
    return String(value).replace('T', ' ').slice(0, 16);
}

function shorten(text) {
    if (!text) return '-';
    return text.length > 46 ? text.slice(0, 46) + '…' : text;
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text).replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
</script>
</body>
</html>
