server:
  port: 8080

spring:
  application:
    name: smartgrade-monolith
  # 单体版 Demo 默认使用内存数据库 H2，零安装即可演示；
  # 第 3 周起可换成 MySQL 8（用户库 + 业务库分库）。
  datasource:
    url: jdbc:h2:mem:smartgrade;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # 演示用密钥；真实项目改为配置中心下发，不写入代码仓库
    secret: smartgrade-monolith-demo-secret-key-please-change-in-production-2026
    ttl-hours: 8
  demo:
    # 启动时自动灌入演示数据（班级 / 教师 / 学生 / 题库 / 作业）
    seed-data: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.swu.smartgrade: INFO
