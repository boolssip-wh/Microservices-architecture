services:
  mysql:
    image: mysql:8.4
    container_name: smartgrade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - smartgrade_mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: smartgrade-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: smartgrade-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - smartgrade_redis:/data

  kafka:
    image: apache/kafka:3.7.2
    container_name: smartgrade-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - smartgrade_kafka:/var/lib/kafka/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: smartgrade-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartgrade
      MINIO_ROOT_PASSWORD: smartgrade123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smartgrade_minio:/data

  seata-server:
    image: seataio/seata-server:2.1.0
    container_name: smartgrade-seata
    profiles: ["governance"]
    environment:
      SEATA_PORT: "8091"
      STORE_MODE: file
      TZ: Asia/Shanghai
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - smartgrade_seata:/root/seata-server

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: smartgrade-skywalking-oap
    profiles: ["governance"]
    environment:
      SW_STORAGE: h2
      SW_CORE_GRPC_PORT: "11800"
      SW_CORE_REST_PORT: "12800"
      TZ: Asia/Shanghai
    ports:
      - "11800:11800"
      - "12800:12800"

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: smartgrade-skywalking-ui
    profiles: ["governance"]
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    ports:
      - "12801:8080"

  nginx:
    image: nginx:1.26-alpine
    container_name: smartgrade-nginx
    profiles: ["web"]
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../smartgrade-web/dist:/usr/share/nginx/html:ro

volumes:
  smartgrade_mysql:
  smartgrade_redis:
  smartgrade_kafka:
  smartgrade_minio:
  smartgrade_seata:
