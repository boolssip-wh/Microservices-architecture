# A1 单服务启动证据：user-service 对架构图 C01 身份与教师偏好服务，健康检查端口 8081。
server:
  port: 8081

spring:
  application:
    # B2 注册名：Nacos 服务列表和 Feign 调用都使用这个名称，不依赖 IP。
    name: smartgrade-user-service
  config:
    # B3 外置配置：启动时读取 Nacos 的 DataId=smartgrade-common.yaml，修改后可刷新。
    import: "optional:nacos:smartgrade-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartgrade_user;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        # B2 注册中心地址；register-enabled=true 表示服务启动后主动注册到 Nacos。
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1111}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:smartgrade-platform-demo-secret-key-2026-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
